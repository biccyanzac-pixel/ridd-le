name = "jacob-gg-leaderboard"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Created by: wrangler d1 create jacob-gg-leaderboard
# Then paste the printed database_id below (or pass --var at deploy time).
[[d1_databases]]
binding = "DB"
database_name = "jacob-gg-leaderboard"
database_id = "f43847da-3fcb-4f58-a78c-438c4ff17c01"

# Workers AI, the judge's backup provider (scoring v6, src/judge.js). Free
# plan: 10,000 neurons a day; gpt-oss-20b costs about 21 neurons a judge call.
[ai]
binding = "AI"

# Every 10 minutes: score answers queued while judging was paused, and
# pre-judge the likely answers for today's and tomorrow's riddles.
[triggers]
crons = ["*/10 * * * *"]

[vars]
# The browser's origin(s) allowed to call this API. Restricts the shared
# leaderboard to this game, not the whole internet.
ALLOWED_ORIGIN = "https://biccyanzac-pixel.github.io"
# Judge provider slots. Secrets live outside this file:
#   npx wrangler secret put GROQ_API_KEY            (Groq free tier: 200k tokens a day per model, about 350 judge calls)
#   npx wrangler secret put GEMINI_API_KEY        (only if a slot uses gemini)
#   npx wrangler secret put JUDGE_ADMIN_TOKEN     (the owner's log/override token)
# Chosen by docs/judge-eval.md. Groq's free tier allows 200k tokens a day per
# model (about 475 judge calls for Qwen); Workers AI's 10k neurons a day are
# about 400 gpt-oss-20b calls, leaving room for anything else on the account.
JUDGE_PRIMARY = "groq"
JUDGE_PRIMARY_MODEL = "qwen/qwen3.8-27b"
JUDGE_PRIMARY_DAILY = "450"
JUDGE_BACKUP = "cloudflare"
JUDGE_BACKUP_MODEL = "@cf/openai/gpt-oss-20b"
JUDGE_BACKUP_DAILY = "400"
